name: UI parity (Extend reference)

# Visual and accessibility gates for the Extend UI alignment (#165).
#
# Gate behaviour:
#   - `ui-contracts`      style-token guards + committed-baseline approval contract
#                         + the icon policy ledger (`pnpm icons:check`, #180).
#   - `ui-parity-core`    pull-request core subset against the pinned reference AND
#                         the committed baselines at the fast 1440x900 + 390x844
#                         viewports, in the final `--gate-mode all`.
#   - `ui-parity-nightly` the full 4-viewport × light/dark matrix for every surface,
#                         baseline-compared against all four committed viewports
#                         (#174), nightly and on dispatch, also in `--gate-mode all`.
#   - `ui-a11y`           axe-core WCAG A/AA + keyboard smoke for the core components.
#
# The final gate is on: both parity jobs pass `--gate-mode all`, so any captured
# parity or baseline failure blocks. The only non-gating surface is the
# upstream-unreachable `pptx-presenter`, which is reported as unreachable and is
# not captured (docs/testing/ui-parity-ci.md).
#
# L2 route parity (#182) runs report-only in `ui-parity-routes`: it compares the
# whole `/pdf-viewer` product region against the pinned upstream route, uploads
# the route matrix and captures, and does not block until the classified product
# differences in tools/parity-fixtures/routes.json are fixed
# (docs/testing/ui-parity-routes.md).
#
# Everything is diffed against `tests/visual/extend/**`; those PNGs are only
# updated through `pnpm ui:baseline capture --approve ...` (see
# tests/visual/extend/README.md). `ui-contracts` fails when a baseline changed
# without a matching approval record.
#
# Icon policy (#180): `pnpm icons:check` fails on a direct `@hugeicons/*` import
# that is not in `tests/icons/allowlist.json`, on Lucide/Hugeicons mixing, on
# any third icon library and on drift between the ledger and
# docs/design/icon-policy.md. OfficeIcon + @lucide/vue stays the default.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/**"
      - "packages/*/src/**"
      - "tests/visual/**"
      - "tests/style/**"
      - "tests/a11y/**"
      - "tests/icons/**"
      - "docs/design/**"
      - "docs/testing/ui-parity-ci.md"
      - "docs/testing/ui-parity-routes.md"
      - "tools/parity-fixtures/routes.json"
      - "apps/demo/src/pages/PdfViewerPage.vue"
      - "apps/demo/src/lib/route-capture.ts"
      - "tools/extend-reference/**"
      - "scripts/ci/route-parity.mjs"
      - "scripts/ci/route-parity.py"
      - "stylelint.config.mjs"
      - "scripts/ci/pixel-parity.mjs"
      - "scripts/ci/pixel-parity.py"
      - "scripts/ci/reference-build.mjs"
      - "scripts/ci/visual-baseline.mjs"
      - "scripts/ci/a11y-check.mjs"
      - "scripts/ci/a11y-check.py"
      - "scripts/ci/lint-styles.mjs"
      - "scripts/ci/verify-icons.mjs"
      - "scripts/ci/icon-allowlist.mjs"
      - "scripts/ci/extend-tokens.mjs"
      - "packages/*/package.json"
      - ".github/workflows/ui-parity.yml"
  schedule:
    # Nightly full matrix, before the blackbox browser suites.
    - cron: "30 17 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  ui-contracts:
    name: UI style guards and baseline approvals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # New bare hex/radius/font-size/shadow/transition values in component CSS
      # fail here; the frozen debt lives in tests/style/component-style-baseline.json.
      - name: Lint component styles against the token layer
        run: pnpm lint:style

      # Icon policy (#180): OfficeIcon/Lucide is the default; a direct
      # @hugeicons/* import outside tests/icons/allowlist.json, Lucide/Hugeicons
      # mixing, a third icon library or ledger drift against
      # docs/design/icon-policy.md fails here.
      - name: Verify the icon policy ledger
        run: pnpm icons:check
        env:
          ICON_GUARD_EVIDENCE_DIR: output/icons-guard

      # A baseline PNG may only change together with an approval record
      # (pnpm ui:baseline capture --approve ...). Hand edits fail here.
      - name: Verify the visual baseline approval contract
        run: pnpm ui:baseline:verify

      - name: Upload the style guard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-style-guard
          path: |
            output/style-guard/
            output/icons-guard/
          if-no-files-found: ignore
          retention-days: 30

  ui-parity-core:
    name: Extend parity (core subset)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      # The harness only needs Chromium; WebKit is not available for this suite.
      - name: Install the Chromium browser
        run: playwright install --with-deps chromium

      # Token drift is a hard failure: the report must match the pinned CSS.
      - name: Verify the Extend token report is current
        run: pnpm ui:tokens:check

      # Final gate: live reference parity and committed-baseline diffs both
      # block. `pptx-presenter` is unreachable and is skipped, not faked.
      # This pair is the fast pull-request gate and must stay in sync with
      # `coreSubset.viewports` in tools/parity-fixtures/manifest.json (unit-tested);
      # the 1280x720 / 768x1024 baselines are compared by the nightly job.
      - name: Capture and gate the core parity subset
        run: >-
          pnpm ui:parity -- --only "${UI_PARITY_SUBSET}"
          --viewports "${UI_PARITY_VIEWPORTS}" --themes "${UI_PARITY_THEMES}"
          --baseline --gate-mode all
          --skip-tokens
        env:
          UI_PARITY_SUBSET: core
          UI_PARITY_VIEWPORTS: 1440x900,390x844
          UI_PARITY_THEMES: light,dark

      # The reference page compared with itself must stay pixel-identical; this
      # catches font, animation or screenshot-timing regressions in the harness.
      - name: Verify the harness is deterministic
        run: pnpm ui:parity:self-check -- --no-build --viewports 1440x900 --themes light

      - name: Upload the parity report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-parity-core-${{ github.sha }}
          path: output/ui-parity/
          if-no-files-found: error
          retention-days: 30

  ui-parity-nightly:
    name: Extend parity (full matrix)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the Chromium browser
        run: playwright install --with-deps chromium

      - name: Verify the Extend token report is current
        run: pnpm ui:tokens:check

      # Full 4-viewport × light/dark matrix for every renderable surface (#174).
      # Every captured viewport/theme has a committed baseline, so this job
      # baseline-compares all 864 cases: a missing, hand-edited or drifted PNG
      # blocks. Do not add `--viewports` here — narrowing the matrix would leave
      # the 1280x720 / 768x1024 baselines uncompared (tests/unit/ui-parity-gate.test.mjs).
      - name: Capture and gate the full parity matrix
        run: pnpm ui:parity -- --baseline --gate-mode all

      - name: Upload the full parity report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-parity-full-${{ github.sha }}
          path: output/ui-parity/
          if-no-files-found: error
          retention-days: 30

  ui-parity-routes:
    name: L2 route parity (report-only, #182)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the Chromium browser
        run: playwright install --with-deps chromium

      # Report-only until the classified product differences are fixed: the
      # command builds the pinned upstream route reference and the demo, then
      # captures reference/subject/diff/heatmap for every route x viewport x
      # theme. `--gate-mode off` keeps the artifact non-blocking.
      - name: Capture the L2 route matrix (report-only)
        run: pnpm ui:parity:routes -- --gate-mode off

      - name: Upload the route matrix and captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-parity-routes-${{ github.sha }}
          path: output/ui-parity-routes/
          if-no-files-found: error
          retention-days: 30

  ui-a11y:
    name: Core component accessibility (axe + keyboard)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the Chromium browser
        run: playwright install --with-deps chromium

      # `--build` builds the workspace packages the comparison app imports by
      # name, then tools/vue-reference. axe-core is injected from node_modules.
      # Known findings are listed in tests/a11y/allowlist.json with an owner
      # issue; anything new fails the job.
      - name: Run axe-core and the keyboard smoke
        run: pnpm test:a11y -- --build

      - name: Upload the accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-a11y-${{ github.sha }}
          path: output/a11y/
          if-no-files-found: error
          retention-days: 30
