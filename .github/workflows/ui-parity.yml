name: UI parity (Extend reference)

# Runs the #155 pixel-parity harness against the pinned extend-hq/ui reference
# components and uploads the report. The capture job is intentionally not a
# required check yet: Button (#157), the PDF chrome (#158/#162) and the file
# components (#163) still report their real delta. #165 flips the gate on by
# running `pnpm ui:parity` (non-zero on threshold failures) as a required job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/**"
      - "packages/vue-ui/src/styles/**"
      - "packages/vue-ui/src/components/**"
      - "packages/vue-pdf/src/components/**"
      - "docs/design/**"
      - "scripts/ci/pixel-parity.mjs"
      - "scripts/ci/pixel-parity.py"
      - "scripts/ci/extract-extend-tokens.mjs"
      - ".github/workflows/ui-parity.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  ui-parity:
    name: Extend reference pixel parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      # The harness only needs Chromium; WebKit is not available for this suite.
      - name: Install the Chromium browser
        run: playwright install --with-deps chromium

      # Token drift is a hard failure: the report must match the pinned CSS.
      - name: Verify the Extend token report is current
        run: pnpm ui:tokens:check

      # Report mode keeps the artifact available while the parity issues land.
      # Replace with `pnpm ui:parity` (threshold gate) in #165.
      - name: Capture the parity matrix
        run: pnpm ui:parity:report

      # The reference page compared with itself must stay pixel-identical; this
      # catches font, animation or screenshot-timing regressions in the harness.
      - name: Verify the harness is deterministic
        run: pnpm ui:parity:self-check -- --no-build --viewports 1440x900 --themes light

      - name: Upload the parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-parity-report
          path: output/ui-parity/
          if-no-files-found: error
          retention-days: 30
