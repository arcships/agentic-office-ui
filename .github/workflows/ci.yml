name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # Browser blackbox suites (including the XLSX merge/worker parity and export
  # paths) run nightly instead of on every pull request.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"
  # Corepack otherwise fetches the latest pnpm metadata; a rotated signature
  # key on the runner makes that fail. Use the pinned packageManager version.
  COREPACK_DEFAULT_TO_LATEST: "0"

jobs:
  check:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # run-suite.mjs reuses the build produced by the steps below instead of
      # rebuilding inside every suite.
      CI_PREBUILT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The unit suite reopens exported workbooks with the pinned openpyxl;
      # no browser is downloaded for this job.
      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Typecheck plus every workspace build: the unit suite inspects
      # apps/demo/dist to verify published chunk separation.
      - name: Build workspace packages and demo apps
        run: pnpm build

      - name: Run the unit suite
        run: pnpm test:unit

      - name: Run the component suite
        run: pnpm test:component

      - name: Package the npm candidate
        if: github.event_name == 'push'
        env:
          PACK_EVIDENCE_DIR: output/release-pack
          RELEASE_CI_CANDIDATE: "1"
          RELEASE_CANDIDATE_DIR: output/release-candidate
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_PACK_MANIFEST: output/release-pack/summary.json
        run: |
          node scripts/ci/pack-manifests.mjs
          node scripts/ci/prepare-release-artifact.mjs

      - name: Upload the npm candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: output/release-candidate/
          if-no-files-found: error
          retention-days: 90

  pdf:
    name: PDF suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The suite reuses the demo build from this job instead of rebuilding.
      CI_PREBUILT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # pypdf verifies fixture rotation, encryption and text layers; playwright
      # drives the formal PDF preview. The pinned versions match the browser
      # suites' recorded evidence.
      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the pinned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build workspace packages and demo apps
        run: pnpm build

      - name: Run the PDF suite
        run: node scripts/ci/run-suite.mjs pdf

      - name: Upload PDF suite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-suite-${{ github.sha }}
          path: output/acceptance/
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    name: Acceptance shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Offline verification shards: no upstream checkout, no preview server
        # and no browser download. Browser suites stay opt-in.
        shard:
          - docs
          - pack
          - self-test
          - release-pack
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run acceptance shard ${{ matrix.shard }}
        run: node scripts/ci/run-acceptance-shard.mjs ${{ matrix.shard }}

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-shard-${{ matrix.shard }}
          path: output/acceptance/
          if-no-files-found: ignore
          retention-days: 14

  blackbox:
    name: Blackbox browser suites
    # Browser suites are opt-in: nightly, or a manual dispatch. Pull requests
    # still run the unit and component suites above, which now include the
    # XLSX fixture, export and registration checks.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_PREBUILT: "1"
      # Only the upstream-reference UX parity step is marked blockable; a
      # blocked XLSX race/fidelity/worker step still fails the suite.
      CI_ALLOW_BLOCKED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack for the pinned package manager
        run: |
          corepack enable
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python verification dependencies
        run: pip install -r requirements-ci.txt

      - name: Install the pinned Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build workspace packages and demo apps
        run: pnpm build

      - name: Run the blackbox suites
        run: node scripts/ci/run-suite.mjs blackbox

      - name: Upload blackbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blackbox-suite-${{ github.sha }}
          path: output/acceptance/
          if-no-files-found: ignore
          retention-days: 14
