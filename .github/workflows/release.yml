name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (for example 0.7.1)
        required: true
      dist_tag:
        description: Target dist-tag
        required: true
        default: latest

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:

  promote:
    name: Promote existing npm versions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for npm dist-tags
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3

      - name: Upgrade npm CLI for trusted dist-tags
        run: npm install -g npm@12.2.3

      - name: Promote every package version
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          for pkg in \
            @arcships/office-interaction \
            @arcships/docx-core \
            @arcships/xlsx-core \
            @arcships/vue-docx \
            @arcships/vue-xlsx \
            @arcships/vue-pdf \
            @arcships/vue-ui \
            @arcships/pptx-core \
            @arcships/vue-pptx; do
            echo "Promoting $pkg@$VERSION -> $DIST_TAG"
            npm dist-tag add "$pkg@$VERSION" "$DIST_TAG"
          done

  publish:
    name: Publish CI candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --event push \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 20 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful CI run found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the exact candidate produced by CI
        uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3

      # Trusted publishing requires npm CLI 11.5.1 or newer. Do not configure
      # an auth token: npm exchanges the GitHub Actions OIDC token instead.
      - name: Upgrade npm CLI for trusted publishing
        run: npm install -g npm@12.2.3

      - name: Verify commit, tag, package versions, files, and hashes
        env:
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_EXPECTED_TAG: ${{ github.ref_name }}
        run: node candidate/prepare-release-artifact.mjs verify candidate

      - name: Publish the eight packages and promote them to latest
        env:
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_EXPECTED_TAG: ${{ github.ref_name }}
          RELEASE_STAGING_TAG: candidate-${{ github.run_id }}
          RELEASE_TARGET_TAG: latest
        run: node candidate/prepare-release-artifact.mjs publish candidate
